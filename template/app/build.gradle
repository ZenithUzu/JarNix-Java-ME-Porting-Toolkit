plugins {
    id 'com.android.application'
}

// APK file name: '<Game Name> (<MIDlet-Vendor>) v<version>' (+ -debug/-release from Gradle;
// j2a removes '-debug' when it copies the APK to the delivery folder)
base {
    archivesName = '@@APK_NAME@@'
}

android {
    namespace = '@@PACKAGE@@'
    compileSdk = 37

    defaultConfig {
        applicationId = '@@PACKAGE@@'
        minSdk = 21
        // API 37 (Android 17): orientation locks are ignored on tablets/foldables; the port
        // already rescales to any window, so the game just gets letterboxed or bigger.
        targetSdk = 37
        // Time-based code aligns independent PC/Android builds (epoch 2020, seconds).
        versionCode = Math.max(@@VERSION_CODE@@, (int)((System.currentTimeMillis() / 1000L) - 1577836800L))
        versionName = '@@VERSION_NAME@@'
    }

    buildTypes {
        debug {
            // A debuggable app runs noticeably slower on Android (ART turns off optimizations so a
            // debugger can attach). Games want speed: set to true only to debug with breakpoints.
            debuggable = false
        }
        release {
            minifyEnabled = false
            // Signed with the debug key so "Build APK" gives an installable file.
            // Create your own key (Build > Generate Signed Bundle / APK) to publish.
            signingConfig = signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += ['META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA']
        }
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

dependencies {
    implementation project(':engine')
    @@GAME_DEPENDENCY@@
}
