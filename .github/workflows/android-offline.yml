name: Android offline converter
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['tests/menu_ui_smoke.py', 'android-offline/**', 'runtime/**', 'runtime-extra/**', 'runtime-m3g/**', '.github/workflows/android-offline.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - name: Build sample and Android APKs
        run: |
          mkdir -p android-offline/converter/src/androidTest/assets
          python samples/demo-midlet/build.py -o android-offline/converter/src/androidTest/assets/demo.jar
          cd android-offline
          chmod +x gradlew
          ./gradlew :converter:assembleDebug :converter:assembleAndroidTest --stacktrace
          ./gradlew --stop
      - name: Prepare installable APK
        run: cp android-offline/converter/build/outputs/apk/debug/converter-debug.apk j2a-offline-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: j2a-offline-android
          path: j2a-offline-android.apk
          if-no-files-found: error
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test real offline conversion on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          disable-animations: true
          script: |
            adb install android-offline/converter/build/outputs/apk/debug/converter-debug.apk
            adb install android-offline/converter/build/outputs/apk/androidTest/debug/converter-debug-androidTest.apk
            adb shell svc wifi disable
            adb shell svc data disable || true
            adb shell am instrument -w com.zenithuzu.j2a.offline.test/j2a.offline.OfflineSmoke > smoke-result.txt
            cat smoke-result.txt
            grep J2A_OFFLINE_SUCCESS smoke-result.txt
            adb pull /sdcard/Android/data/com.zenithuzu.j2a.offline/files/demo-output.apk demo-output.apk
            adb install demo-output.apk
            adb shell monkey -p $(adb shell pm list packages | sed -n 's/package:\(com.j2a.game.g.*\)/\1/p' | tr -d '\r') 1
            sleep 5
            python tests/menu_ui_smoke.py
            adb logcat -d -s AndroidRuntime:E > android-crashes.txt
            test ! -s android-crashes.txt || ! grep -q 'FATAL EXCEPTION' android-crashes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: j2a-offline-validation
          path: |
            demo-output.apk
            smoke-result.txt
            android-crashes.txt
            menu-screenshots/*.png
          if-no-files-found: warn


  release:
    name: Publish installable Android APK
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: j2a-offline-android
          path: release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/j2a-offline-android.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "j2a Offline $GITHUB_REF_NAME" \
            --notes "APK de prueba de j2a Offline (firmada con clave de depuración de GitHub Actions). Para uso normal, conserva una firma de producción propia: esta compilación no garantiza actualizaciones compatibles entre versiones."
